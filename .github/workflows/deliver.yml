# Push to main → tests → Android AAB to Play internal testing, iOS build to TestFlight, bridge redeployed on the
# host. Runs only in the upstream repository (job-level guard) and only on its two self-hosted runners (label
# `remotly`): the Linux runner on the herdr host and the Mac runner (ci/setup-*-runner.sh). Secrets never enter
# GitHub: each runner reads them from ~/.config/remotly on its own machine (docs/DELIVERY.md). The App Store
# Connect key id and issuer id are repository variables. Build number / versionCode = the run number, monotonic
# and safe to re-run. Pull requests are checked by ci.yml on GitHub-hosted runners.
name: deliver

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android:
        description: Deliver Android to Play internal testing
        type: boolean
        default: true
      ios:
        description: Deliver iOS to TestFlight
        type: boolean
        default: true
      bridge:
        description: Redeploy the bridge on the herdr host
        type: boolean
        default: false
      play_status:
        description: Play release status (draft for a brand-new app that has never been rolled out)
        type: choice
        options: [completed, draft]
        default: completed

concurrency:
  group: deliver-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REMOTLY_PACKAGE: com.inferenceaftermath.remotly
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}

jobs:
  plan:
    name: What changed
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, linux, remotly]
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      bridge: ${{ steps.plan.outputs.bridge }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          IN_ANDROID: ${{ inputs.android }}
          IN_IOS: ${{ inputs.ios }}
          IN_BRIDGE: ${{ inputs.bridge }}
        run: ci/plan.sh

  bridge-test:
    name: Bridge tests
    needs: plan
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.plan.outputs.bridge == 'true' || needs.plan.outputs.android == 'true' || needs.plan.outputs.ios == 'true')
    runs-on: [self-hosted, linux, remotly]
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: tsc + unit tests
        working-directory: bridge
        run: |
          export PATH="${REMOTLY_NODE_BIN:-$HOME/.local/share/fnm/aliases/default/bin}:$PATH"
          node --version
          npm ci
          npx tsc --noEmit
          npm test

  android:
    name: Android → Play internal testing
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.android == 'true'
    runs-on: [self-hosted, linux, remotly]
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Locate host-side secrets
        run: ci/android-env.sh >> "$GITHUB_ENV"
      - name: Test, lint, signed bundle
        working-directory: android
        env:
          REMOTLY_VERSION_CODE: ${{ needs.plan.outputs.build_number }}
        run: |
          ./gradlew -q :core:test :app:lintRelease :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.REMOTLY_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.plan.outputs.build_number }} (${{ github.sha }})
          tracks: internal
          status: ${{ inputs.play_status || 'completed' }}

  ios:
    name: iOS → TestFlight
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.ios == 'true'
    runs-on: [self-hosted, macos, remotly]
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: FlowKit tests
        working-directory: ios/FlowKit
        run: swift test
      - name: Archive and upload
        env:
          REMOTLY_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          REMOTLY_WORK_DIR: ${{ runner.temp }}/remotly-out
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "set the repository variables ASC_KEY_ID and ASC_ISSUER_ID (Settings → Secrets and variables → Actions → Variables)" >&2; exit 1
          fi
          export ASC_API_KEY_P8="$HOME/.config/remotly/asc-api-key.p8"
          test -r "$ASC_API_KEY_P8" || { echo "missing ~/.config/remotly/asc-api-key.p8 on the Mac runner" >&2; exit 1; }
          rm -rf "$REMOTLY_WORK_DIR"
          if ! ios/scripts/testflight.sh; then
            echo "::group::archive.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/archive.log" 2>/dev/null; echo "::endgroup::"
            echo "::group::export.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/export.log" 2>/dev/null; echo "::endgroup::"
            exit 1
          fi

  bridge-deploy:
    name: Bridge → the herdr host
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.bridge == 'true'
    runs-on: [self-hosted, linux, remotly]
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Fast-forward the deployed checkout and restart the unit
        env:
          TARGET_SHA: ${{ github.sha }}
        run: ci/deploy-bridge.sh
