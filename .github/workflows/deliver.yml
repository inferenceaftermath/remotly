# Push to main → tests → Android AAB to Play internal testing, iOS build to TestFlight, the push relay's Worker to
# Cloudflare, on GitHub-hosted runners. Runs only in the upstream repository (job-level guard): the upload key, the
# Firebase configuration, the Play service account, the App Store Connect API key and the Cloudflare API token are its
# repository secrets (docs/DELIVERY.md, "Secrets"); the App Store Connect key id and issuer id and the Cloudflare account
# id are repository variables. Build number / versionCode = the run number, monotonic (a store lane whose upload
# succeeded is not re-run — the stores refuse a build number twice; the next push delivers it). Pull requests are
# checked by ci.yml. The bridge is not delivered from main: a `bridge-vX.Y.Z` tag releases it (release.yml) and hosts
# install releases (install.sh, then `remotly-bridge update` and its timer).
name: deliver

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android:
        description: Deliver Android to Play internal testing
        type: boolean
        default: true
      ios:
        description: Deliver iOS to TestFlight
        type: boolean
        default: true
      relay:
        description: Deploy the push relay (Cloudflare Worker)
        type: boolean
        default: true
      play_status:
        description: Play release status (draft for a brand-new app that has never been rolled out)
        type: choice
        options: [completed, draft]
        default: completed

# One delivery at a time, a running one is never cancelled, and every run waits its turn (`queue: max`; the default
# single pending slot would let a manual dispatch replace a waiting push, or the reverse). GitHub keeps at most 100
# waiting; past that it rejects new runs — the next accepted push delivers everything pending, since each lane is planned
# from what it last delivered (refs/delivered/<lane>, ci/plan.sh), not from the push's parent. Runs are not started in
# push order: only main's tip delivers (ci/lane-guard.sh), the others do nothing.
concurrency:
  group: deliver-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read # the lanes take `write` for their delivery markers (refs/delivered/<lane>)

env:
  REMOTLY_PACKAGE: com.inferenceaftermath.remotly
  REMOTLY_RELAY_HOST: relay.remotly.dev # the route in relay/wrangler.jsonc; the relay lane checks /health there
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}

jobs:
  plan:
    name: What changed
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      relay: ${{ steps.plan.outputs.relay }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_ANDROID: ${{ inputs.android }}
          IN_IOS: ${{ inputs.ios }}
          IN_RELAY: ${{ inputs.relay }}
        # Each lane is diffed from the commit it last delivered (its marker on origin), not from this push's parent: a
        # lane that failed last time is retried by the next push, and a run that is no longer main's tip does nothing.
        run: ci/plan.sh

  bridge-test:
    name: Bridge tests # gates the app lanes (the apps speak the protocol these tests pin), not the relay
    needs: plan
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.plan.outputs.android == 'true' || needs.plan.outputs.ios == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: tsc + unit tests
        working-directory: bridge
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  android:
    name: Android → Play internal testing
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.android == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/android
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh android
      - name: Forget the last android delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget android
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.guard.outputs.deliver == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: steps.guard.outputs.deliver == 'true'
        with:
          validate-wrappers: true
      - name: Upload key and Firebase configuration from the repository secrets
        if: steps.guard.outputs.deliver == 'true'
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        # Every secret the lane needs is checked here, by its name; the files go to the runner's temp dir, and
        # android/app/build.gradle.kts reads REMOTLY_STORE_FILE and REMOTLY_GOOGLE_SERVICES_JSON (paths) plus the
        # passwords from the build step's own environment.
        run: |
          for v in ANDROID_UPLOAD_KEYSTORE_BASE64 ANDROID_UPLOAD_STORE_PASSWORD ANDROID_UPLOAD_KEY_ALIAS ANDROID_UPLOAD_KEY_PASSWORD ANDROID_GOOGLE_SERVICES_JSON PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!v}" ] || { echo "the repository secret $v is not set (docs/DELIVERY.md, \"Secrets\")" >&2; exit 1; }
          done
          dir="$RUNNER_TEMP/remotly-secrets"; mkdir -p "$dir"; chmod 700 "$dir"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 -d > "$dir/upload.jks"
          printf '%s' "$ANDROID_GOOGLE_SERVICES_JSON" > "$dir/google-services.json"
          { echo "REMOTLY_STORE_FILE=$dir/upload.jks"; echo "REMOTLY_GOOGLE_SERVICES_JSON=$dir/google-services.json"; } >> "$GITHUB_ENV"
      - name: Test, lint, signed bundle
        if: steps.guard.outputs.deliver == 'true'
        working-directory: android
        env:
          REMOTLY_VERSION_CODE: ${{ needs.plan.outputs.build_number }}
          REMOTLY_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          REMOTLY_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          REMOTLY_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon -q :core:test :app:lintRelease :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        if: steps.guard.outputs.deliver == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.REMOTLY_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.plan.outputs.build_number }} (${{ github.sha }})
          tracks: internal
          status: ${{ inputs.play_status || 'completed' }}
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record android

  ios:
    name: iOS → TestFlight
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.ios == 'true'
    runs-on: macos-26 # Xcode 26, as the app is built; the image moves only with a commit here
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh ios
      - name: Forget the last ios delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget ios
      - name: FlowKit tests
        if: steps.guard.outputs.deliver == 'true'
        working-directory: ios/FlowKit
        run: swift test
      - name: xcodegen
        if: steps.guard.outputs.deliver == 'true'
        run: brew install --quiet xcodegen
      - name: Archive and upload
        if: steps.guard.outputs.deliver == 'true'
        env:
          REMOTLY_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          REMOTLY_WORK_DIR: ${{ runner.temp }}/remotly-out
          ASC_API_KEY_P8_CONTENT: ${{ secrets.ASC_API_KEY_P8 }}
        # Signing from the App Store Connect API key alone (-allowProvisioningUpdates): the archive is signed with an
        # Apple Development certificate Xcode creates for this runner (one per run: revoke the stale ones in the
        # developer portal now and then), the export with the team's cloud-managed distribution certificate. Nothing
        # is imported into a keychain here; the key needs the cloud-managed distribution permission (docs/DELIVERY.md).
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "set the repository variables ASC_KEY_ID and ASC_ISSUER_ID (Settings → Secrets and variables → Actions → Variables)" >&2; exit 1
          fi
          [ -n "$ASC_API_KEY_P8_CONTENT" ] || { echo "the repository secret ASC_API_KEY_P8 is not set (docs/DELIVERY.md, \"Secrets\")" >&2; exit 1; }
          export ASC_API_KEY_P8="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          (umask 077; printf '%s\n' "$ASC_API_KEY_P8_CONTENT" > "$ASC_API_KEY_P8")
          rm -rf "$REMOTLY_WORK_DIR"
          if ! ios/scripts/testflight.sh; then
            echo "::group::archive.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/archive.log" 2>/dev/null; echo "::endgroup::"
            echo "::group::export.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/export.log" 2>/dev/null; echo "::endgroup::"
            exit 1
          fi
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record ios

  relay:
    name: Relay → Cloudflare
    needs: plan
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.relay == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/relay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh relay
      - name: Forget the last relay delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget relay
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.guard.outputs.deliver == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - name: tsc + unit tests
        if: steps.guard.outputs.deliver == 'true'
        working-directory: relay
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: Deploy the Worker
        if: steps.guard.outputs.deliver == 'true'
        working-directory: relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        # `wrangler deploy`, as `npm run deploy` by hand (relay/README.md "Deploy"). The Worker's own secrets (APNs key,
        # Firebase service account) live on Cloudflare and survive a deploy; the token only needs to edit Workers in the
        # account named by CLOUDFLARE_ACCOUNT_ID.
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo "the repository secret CLOUDFLARE_API_TOKEN is not set (docs/DELIVERY.md, \"Secrets\")" >&2; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo "set the repository variable CLOUDFLARE_ACCOUNT_ID (Settings → Secrets and variables → Actions → Variables)" >&2; exit 1; }
          npm run deploy
      - name: The deployed relay answers, with both platforms configured
        if: steps.guard.outputs.deliver == 'true'
        # GET /health from the edge, with the user agent the WAF rule lets through, for up to two minutes (a fresh version
        # can take a moment to reach every location). `ok` alone is not enough: the relay answers ok without its Worker
        # secrets and then refuses every push with 503 not_configured, so `apns` and `fcm` must be true as well. A
        # failure here leaves no marker, so the next push deploys again and checks again.
        run: |
          url="https://$REMOTLY_RELAY_HOST/health"
          for attempt in 1 2 3 4 5 6; do
            [ "$attempt" -eq 1 ] || sleep 10
            body=$(curl -fsS --max-time 10 -A 'remotly-bridge/deliver' "$url") || { body=""; continue; }
            if jq -e '.ok == true and .apns == true and .fcm == true' <<< "$body" > /dev/null 2>&1; then echo "$body"; exit 0; fi
          done
          echo "$url did not answer with ok, apns and fcm all true: ${body:-no response}" >&2; exit 1
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record relay
