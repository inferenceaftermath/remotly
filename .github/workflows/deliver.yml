# Push to main → tests → Android AAB to Play internal testing, iOS build to TestFlight, bridge redeployed on the
# host. Runs only in the upstream repository (job-level guard) and only on its two self-hosted runners (label
# `remotly`): the Linux runner on the herdr host and the Mac runner (ci/setup-*-runner.sh). Secrets never enter
# GitHub: each runner reads them from ~/.config/remotly on its own machine (docs/DELIVERY.md); logs mask each runner's
# home directory and, on the bridge lane, the host's Tailscale identity (ci/mask-host.sh); the bridge tooling's own
# output stays in a log file on the host. The App Store Connect key id and issuer id are repository variables. Build number / versionCode = the run number, monotonic
# (a store lane whose upload succeeded is not re-run — the stores refuse a build number twice; the next push delivers
# it). Pull requests are checked by ci.yml on GitHub-hosted runners.
name: deliver

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      android:
        description: Deliver Android to Play internal testing
        type: boolean
        default: true
      ios:
        description: Deliver iOS to TestFlight
        type: boolean
        default: true
      bridge:
        description: Redeploy the bridge on the herdr host
        type: boolean
        default: false
      play_status:
        description: Play release status (draft for a brand-new app that has never been rolled out)
        type: choice
        options: [completed, draft]
        default: completed

# One delivery at a time, a running one is never cancelled, and every run waits its turn (`queue: max`; the default
# single pending slot would let a manual dispatch replace a waiting push, or the reverse). GitHub keeps at most 100
# waiting; past that it rejects new runs — the next accepted push delivers everything pending, since each lane is planned
# from what it last delivered (refs/delivered/<lane>, ci/plan.sh), not from the push's parent. Runs are not started in
# push order: only main's tip delivers (ci/lane-guard.sh), the others do nothing.
concurrency:
  group: deliver-main
  cancel-in-progress: false
  queue: max

permissions:
  contents: read # the lanes take `write` for their delivery markers (refs/delivered/<lane>)

env:
  REMOTLY_PACKAGE: com.inferenceaftermath.remotly
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}

jobs:
  plan:
    name: What changed
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: [self-hosted, linux, remotly]
    outputs:
      android: ${{ steps.plan.outputs.android }}
      ios: ${{ steps.plan.outputs.ios }}
      bridge: ${{ steps.plan.outputs.bridge }}
      build_number: ${{ steps.plan.outputs.build_number }}
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          IN_ANDROID: ${{ inputs.android }}
          IN_IOS: ${{ inputs.ios }}
          IN_BRIDGE: ${{ inputs.bridge }}
        # Each lane is diffed from the commit it last delivered (its marker on origin), not from this push's parent: a
        # lane that failed last time is retried by the next push, and a run that is no longer main's tip does nothing.
        run: ci/plan.sh

  bridge-test:
    name: Bridge tests
    needs: plan
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && (needs.plan.outputs.bridge == 'true' || needs.plan.outputs.android == 'true' || needs.plan.outputs.ios == 'true')
    runs-on: [self-hosted, linux, remotly]
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tsc + unit tests
        working-directory: bridge
        run: |
          export PATH="${REMOTLY_NODE_BIN:-$HOME/.local/share/fnm/aliases/default/bin}:$PATH"
          node --version
          npm ci
          npx tsc --noEmit
          npm test

  android:
    name: Android → Play internal testing
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.android == 'true'
    runs-on: [self-hosted, linux, remotly]
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/android
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh android
      - name: Forget the last android delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget android
      - name: Locate host-side secrets
        if: steps.guard.outputs.deliver == 'true'
        run: ci/android-env.sh >> "$GITHUB_ENV"
      - name: Test, lint, signed bundle
        if: steps.guard.outputs.deliver == 'true'
        working-directory: android
        env:
          REMOTLY_VERSION_CODE: ${{ needs.plan.outputs.build_number }}
        run: |
          ./gradlew -q :core:test :app:lintRelease :app:bundleRelease
          test -s app/build/outputs/bundle/release/app-release.aab
      - name: Upload to Play internal testing
        if: steps.guard.outputs.deliver == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJson: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.REMOTLY_PACKAGE }}
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          releaseName: ${{ needs.plan.outputs.build_number }} (${{ github.sha }})
          tracks: internal
          status: ${{ inputs.play_status || 'completed' }}
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record android

  ios:
    name: iOS → TestFlight
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.ios == 'true'
    runs-on: [self-hosted, macos, remotly]
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/ios
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh ios
      - name: Forget the last ios delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget ios
      - name: FlowKit tests
        if: steps.guard.outputs.deliver == 'true'
        working-directory: ios/FlowKit
        run: swift test
      - name: Archive and upload
        if: steps.guard.outputs.deliver == 'true'
        env:
          REMOTLY_BUILD_NUMBER: ${{ needs.plan.outputs.build_number }}
          REMOTLY_WORK_DIR: ${{ runner.temp }}/remotly-out
        run: |
          export PATH="/opt/homebrew/bin:/usr/local/bin:$PATH"
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "set the repository variables ASC_KEY_ID and ASC_ISSUER_ID (Settings → Secrets and variables → Actions → Variables)" >&2; exit 1
          fi
          export ASC_API_KEY_P8="$HOME/.config/remotly/asc-api-key.p8"
          test -r "$ASC_API_KEY_P8" || { echo "missing ~/.config/remotly/asc-api-key.p8 on the Mac runner" >&2; exit 1; }
          rm -rf "$REMOTLY_WORK_DIR"
          if ! ios/scripts/testflight.sh; then
            echo "::group::archive.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/archive.log" 2>/dev/null; echo "::endgroup::"
            echo "::group::export.log (tail)"; tail -n 80 "$REMOTLY_WORK_DIR/export.log" 2>/dev/null; echo "::endgroup::"
            exit 1
          fi
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record ios

  bridge-deploy:
    name: Bridge → the herdr host
    needs: [plan, bridge-test]
    if: github.repository == 'inferenceaftermath/remotly' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && needs.plan.outputs.bridge == 'true'
    runs-on: [self-hosted, linux, remotly]
    permissions:
      contents: write # ci/mark-delivered.sh moves refs/delivered/bridge
    steps:
      - name: Mask the runner's home directory in the public log
        run: echo "::add-mask::$HOME"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: guard
        name: Still main's tip?
        env:
          EVENT: ${{ github.event_name }}
        run: ci/lane-guard.sh bridge
      - name: Forget the last bridge delivery until this one is done
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh forget bridge
      - name: Mask the host's tailnet identity in the public log
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mask-host.sh
      - name: Fast-forward the deployed checkout and restart the unit
        if: steps.guard.outputs.deliver == 'true'
        env:
          TARGET_SHA: ${{ github.sha }}
        run: ci/deploy-bridge.sh
      - name: Record the delivery
        if: steps.guard.outputs.deliver == 'true'
        run: ci/mark-delivered.sh record bridge
