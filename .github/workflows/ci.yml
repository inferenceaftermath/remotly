# Checks for pull requests and branches, on GitHub-hosted runners only. The self-hosted `remotly` runners belong to
# deliver.yml, which runs solely on pushes to `main` of the upstream repository.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge (tsc, tests, shell syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - working-directory: bridge
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Shell syntax and the deploy script's rollback test
        run: |
          sh -n install.sh
          bash -n bridge/scripts/package.sh ci/*.sh ci/test/*.sh scripts/*.sh
          bash ci/test/deploy-bridge.test.sh

  relay:
    name: Relay (tsc, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - working-directory: relay
        run: |
          npm ci
          npm run typecheck
          npm test

  android:
    name: Android (unit tests, debug APK, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
      - working-directory: android
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug

  ios:
    name: iOS (FlowKit tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - working-directory: ios/FlowKit
        run: swift test
