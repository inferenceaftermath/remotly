# Checks for pull requests; a branch without a pull request is not checked (open a draft). Deliveries to the stores
# are deliver.yml's, on pushes to `main` of the upstream repository.
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Bridge (tsc, tests, shell syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - working-directory: bridge
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: Shell syntax, shellcheck, and the scripts' tests (delivery plan, lane guard, markers, release plan and notes)
        run: |
          sh -n install.sh
          shellcheck -s sh install.sh
          bash -n bridge/scripts/*.sh ci/*.sh ci/e2e/*.sh ci/test/*.sh scripts/*.sh
          shellcheck bridge/scripts/*.sh ci/e2e/*.sh
          bash ci/test/plan.test.sh
          bash ci/test/lane-guard.test.sh
          bash ci/test/mark-delivered.test.sh
          bash ci/test/release-plan.test.sh
          bash ci/test/release-notes.test.sh
      - name: The store promotion scripts' tests (promote.yml)
        run: node --test store/test/*.test.mjs

  bridge-hosts:
    name: Bridge on ${{ matrix.os }} (tests, install from the package, the service end to end)
    # The bridge runs on Linux (systemd user unit) and macOS (launchd agent): both get the unit tests, an install from
    # the packaged tarball the way a user does, and the service brought up and checked under the host's own manager
    # (ci/e2e/bridge-service.sh). The Linux image is release.yml's; macos-26 is the delivery lane's (deliver.yml).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Loopback aliases for the connection-cap test (Linux has all of 127/8 on loopback; macOS only 127.0.0.1)
        if: runner.os == 'macOS'
        run: sudo ifconfig lo0 alias 127.0.0.2 up && sudo ifconfig lo0 alias 127.0.0.3 up
      - name: Typecheck and tests on this host (stty, ps, perl's flock and launchctl are the real ones here)
        working-directory: bridge
        run: |
          npm ci
          npx tsc --noEmit
          npm test
      - name: GNU tar for the package (macOS ships bsdtar)
        if: runner.os == 'macOS'
        run: brew install --quiet gnu-tar
      - name: Package
        run: bridge/scripts/package.sh
      - name: Install from the package and run the service end to end
        run: bash ci/e2e/bridge-service.sh

  relay:
    name: Relay (tsc, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - working-directory: relay
        run: |
          npm ci
          npm run typecheck
          npm test

  android:
    name: Android (unit tests, debug APK, lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true
      - working-directory: android
        run: ./gradlew --no-daemon :core:test :app:assembleDebug :app:lintDebug

  ios:
    name: iOS (FlowKit tests) # the name is a required check of the main ruleset; the app compile step is inside
    runs-on: macos-26 # the delivery lane's image and Xcode (deliver.yml)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - working-directory: ios/FlowKit
        run: swift test
      - name: The app compiles with the lane's Xcode (no signing)
        working-directory: ios
        run: |
          brew install --quiet xcodegen
          xcodegen generate --quiet
          xcodebuild build -quiet -project Remotly.xcodeproj -scheme Remotly -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
