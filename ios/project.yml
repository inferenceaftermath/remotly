# XcodeGen spec for the Remotly iOS app. Generate with `xcodegen generate` (never hand-edit the pbxproj).
name: Remotly
options:
  bundleIdPrefix: com.inferenceaftermath
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
  developmentLanguage: en
  xcodeVersion: "16.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: DA2SG9BMQ3
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
    Release:
      SWIFT_COMPILATION_MODE: wholemodule

packages:
  FlowKit:
    path: FlowKit

targets:
  Remotly:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Remotly
        excludes:
          - "Info.plist"
          - "Remotly.entitlements"
          - "**/.DS_Store"
      # Hand-written; referenced via INFOPLIST_FILE / CODE_SIGN_ENTITLEMENTS below (an `info:` /
      # `entitlements:` block would make XcodeGen regenerate them).
      - path: Remotly/Info.plist
        buildPhase: none
      - path: Remotly/Remotly.entitlements
        buildPhase: none
      # Live Activity attributes and the Approve/Deny intent: compiled into the app and the widget extension.
      - path: Shared
    dependencies:
      - package: FlowKit
        product: FlowKit
      - target: FlowActivity
    settings:
      base:
        PRODUCT_NAME: Remotly
        PRODUCT_BUNDLE_IDENTIFIER: com.inferenceaftermath.remotly
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Remotly/Info.plist
        CODE_SIGN_ENTITLEMENTS: Remotly/Remotly.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        # REMOTLY_APP marks app-only code in the Shared sources (the intent's perform body).
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) REMOTLY_APP"

  # WidgetKit extension hosting the Live Activity (Lock Screen / Dynamic Island) of a working agent. No entitlements:
  # the bridge starts and updates it over APNs with the tokens the app hands over (activity.register).
  FlowActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: FlowActivity
        excludes:
          - "Info.plist"
      - path: FlowActivity/Info.plist
        buildPhase: none
      - path: Shared
      # JetBrains Mono for the Lock Screen (DESIGN.md §4.11); listed in FlowActivity/Info.plist UIAppFonts. The
      # widget falls back to the system monospaced font if the resource is missing.
      - path: Remotly/Fonts
    settings:
      base:
        PRODUCT_NAME: FlowActivity
        PRODUCT_BUNDLE_IDENTIFIER: com.inferenceaftermath.remotly.activity
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FlowActivity/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"

schemes:
  # The app scheme deliberately has no `test:` action: the only tests live in the local package, and
  # referencing package test targets from a scheme (`package: FlowKit/FlowKitTests`) is the one
  # XcodeGen construct here we could not verify. It is confined to the FlowKitTests scheme below so
  # the build scheme stays valid whatever XcodeGen says (see NOTES.md "Review pass").
  Remotly:
    build:
      targets:
        Remotly: all
    run:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Optional. If `xcodegen generate` rejects `package:` below, delete this whole scheme and run the
  # tests with `cd FlowKit && swift test` or Xcode's auto-created FlowKit package scheme.
  FlowKitTests:
    build:
      targets:
        Remotly: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - package: FlowKit/FlowKitTests
